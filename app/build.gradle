plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Réglages propres à chaque poste, hors du dépôt : -PserverUrl=… en ligne de commande, ou dans local.properties (non versionné).
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def setting = { String name, String fallback ->
    (project.findProperty(name) ?: localProps.getProperty(name) ?: fallback) as String
}

android {
    namespace 'com.example.miniprojet'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.miniprojet"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        // émulateur Android -> serveur lancé sur la machine hôte
        buildConfigField "String", "SERVER_URL", "\"${setting('serverUrl', 'http://10.0.2.2:5000')}\""
        // clé TomTom (https://developer.tomtom.com) : sans elle, l'application fonctionne mais la carte reste vide
        resValue "string", "API_KEY_TOMTOM", setting('tomtomKey', '')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        jniLibs.pickFirsts.add("lib/**/libc++_shared.so")
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    useLibrary 'org.apache.http.legacy'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // volley
    implementation 'com.android.volley:volley:1.2.1'
    // native socket.io
    implementation ('io.socket:socket.io-client:2.0.0') {
        exclude group: 'org.json', module: 'json'
    }
    implementation 'com.google.android.gms:play-services-location:17.0.0'
    implementation 'com.google.android.gms:play-services-maps:17.0.0'
    //tomtom map
    implementation "com.tomtom.sdk.maps:map-display:0.12.0"
    implementation "com.tomtom.sdk.location:provider-android:0.12.0"


}